<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Manpower Planner</title>
<style>
:root{
  --bg:#f5f7fa;--surface:#fff;--surface2:#f8fafc;--ink:#17212b;--muted:#6e7b88;
  --line:#dfe5eb;--navy:#123a59;--blue:#2d6f9f;--shadow:0 8px 28px rgba(23,33,43,.06);
  --red:#b54343;--amber:#9b6a19;--green:#24704f;--purple:#6c55a3;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}body{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand h1{font-size:18px;margin:0;color:var(--navy);letter-spacing:-.015em}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:750}.btn:hover{border-color:#b9c6d1}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.ghost{background:transparent}.btn.small{padding:7px 9px;font-size:12px}
.shell{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
.sidebar,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sidebar{padding:14px;height:calc(100vh - 92px);position:sticky;top:78px;overflow:auto}.side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.side-title b{font-size:13px;color:var(--navy)}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.search:focus{border-color:#8eb0c8;box-shadow:0 0 0 3px rgba(45,111,159,.1)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750;color:#53616e}.chip.active{background:#eef5fa;border-color:#bfd3e2;color:var(--navy)}
.employee-list{display:flex;flex-direction:column;gap:7px}.person{border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 10px;display:flex;align-items:center;gap:9px;user-select:none}.person:hover{background:#fafcfd}.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.person-main{min-width:0;flex:1}.person-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-meta{font-size:10px;color:var(--muted);margin-top:2px}.status{font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px;background:#f1f3f5;color:#6b7480}.status.pto{background:#f7e9e9;color:#9a4141}.status.school{background:#efeafd;color:#68549b}.status.absent{background:#fff0d7;color:#8f6017}
.main{min-width:0}.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);margin-bottom:12px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#f8fafb}.seg button{border:0;background:transparent;padding:7px 10px;border-radius:7px;font-weight:800;color:#697785;font-size:12px}.seg button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.week-label{font-weight:850;color:var(--navy);min-width:180px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(5,minmax(255px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}.day{min-width:255px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow:hidden}.day-head{padding:11px 12px 10px;background:#fff;border-bottom:1px solid var(--line)}.day-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.day-name{font-weight:900;color:var(--navy);font-size:13px}.date{color:var(--muted);font-size:10px;margin-top:2px}.weather{font-size:10px;color:#53616e;text-align:right}.day-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:9px;font-weight:850;padding:4px 6px;border-radius:999px;background:#f3f6f8;color:#5e6d79}.pill.ot{background:#fff0d8;color:#8a5b12}.day-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:430px}
.job{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.job.high{border-left:4px solid var(--red)}.job.behind{box-shadow:inset 0 0 0 1px #e1c07b}.job-head{padding:10px 11px;display:flex;align-items:flex-start;gap:8px}.job-main{flex:1;min-width:0}.job-title{font-weight:900;color:#17364f;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.job-sub{font-size:10px;color:var(--muted);margin-top:2px}.job-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:8px;font-weight:900;letter-spacing:.02em;border-radius:999px;padding:3px 6px;background:#eef3f7;color:#5e6c79}.tag.high{background:#fbe9e9;color:#a23c3c}.tag.behind{background:#fff0d7;color:#8e5f14}.tag.ot{background:#fff0d7;color:#8e5f14}.collapse{border:0;background:transparent;color:#778592;font-size:14px;padding:0 2px}.job-stats{padding:0 11px 9px;display:flex;gap:6px;flex-wrap:wrap}.stat{font-size:9px;font-weight:800;color:#5b6874}.progress{height:5px;background:#edf1f4;border-radius:999px;overflow:hidden;margin:0 11px 10px}.progress i{display:block;height:100%;background:#6d91aa}.job-body{border-top:1px solid var(--line);padding:9px 10px 10px}.job.collapsed .job-body{display:none}.class-group{margin-top:7px}.class-head{display:flex;justify-content:space-between;color:#73808d;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin:3px 0 5px}.assignment{display:flex;align-items:center;gap:7px;border:1px solid #e6eaee;border-radius:9px;padding:7px 8px;background:#fbfcfd;margin-bottom:5px}.assignment .dot{width:8px;height:8px}.assignment .name{font-size:10px;font-weight:850;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.assignment .time{font-size:9px;color:#778591}.lead-badge{font-size:8px;background:#eaf2f8;color:#285e83;font-weight:900;padding:2px 5px;border-radius:999px}.crew-indent{margin-left:13px}.notes{font-size:9px;color:#6f7c87;background:#f8fafb;border-radius:8px;padding:7px;margin-top:8px}.job-actions{display:flex;gap:5px;margin-top:8px}.job-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;font-size:9px;font-weight:850;color:#53616e}.add-job{border:1px dashed #bdc9d3;background:transparent;color:#63717d;border-radius:10px;padding:9px;font-size:10px;font-weight:850;width:100%}
.legend{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.legend b{font-size:10px;color:#52616d}.legend-item{display:flex;align-items:center;gap:5px;font-size:9px;color:#687784}
.modal{position:fixed;inset:0;background:rgba(9,20,30,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.modal-head h3{margin:0;color:var(--navy);font-size:16px}.modal-body{padding:15px 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:850;color:#61707c}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;outline:none}.field textarea{min-height:76px;resize:vertical}.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.empty{padding:24px 12px;text-align:center;color:#8a96a1;font-size:11px}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.employee-list{display:grid;grid-template-columns:repeat(3,1fr)}.calendar{grid-template-columns:repeat(5,280px)}}
@media(max-width:700px){.topbar-inner{padding:10px 12px}.brand p{display:none}.actions .btn:not(.primary){display:none}.shell{padding:10px}.sidebar{display:none}.toolbar{align-items:flex-start}.toolbar,.toolbar-left,.toolbar-right{gap:6px}.toolbar{flex-direction:column}.week-label{text-align:left;min-width:0}.calendar{grid-template-columns:1fr;overflow:visible}.day{min-width:0}.day-body{min-height:0}.grid2{grid-template-columns:1fr}.field.full{grid-column:auto}.legend{display:none}}
@media print{.topbar,.sidebar,.toolbar,.add-job,.job-actions,.legend{display:none!important}.shell{display:block;max-width:none;padding:0}.calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:visible}.day{min-width:0;break-inside:avoid}.day-body{min-height:0}.job{break-inside:avoid}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><h1>Manpower Planner</h1><p>Weekly staffing and look-ahead schedule</p></div>
    <div class="actions"><a class="btn" href="index.html" style="text-decoration:none">← Home</a><button class="btn" id="printBtn">Print / PDF</button><button class="btn primary" id="addJobTop">+ Add Job</button></div>
  </div>
</header>
<div class="shell">
  <aside class="sidebar">
    <div class="side-title"><b>Employee Pool</b><button class="btn small" id="addEmployee">+ Add</button></div>
    <input class="search" id="employeeSearch" placeholder="Search employees" />
    <div class="filter-row"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="electrical">Electrical</button><button class="chip" data-filter="security">Security</button><button class="chip" data-filter="available">Available</button></div>
    <div class="employee-list" id="employeeList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="seg"><button id="prevWeek">‹</button><button class="active">Week</button><button id="nextWeek">›</button></div>
        <div class="week-label" id="weekLabel"></div>
      </div>
      <div class="toolbar-right">
        <div class="seg" id="divisionSeg"><button class="active" data-division="all">All</button><button data-division="electrical">Electrical</button><button data-division="security">Security</button></div>
        <button class="btn small" id="duplicateWeek">Duplicate Week</button>
      </div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="legend">
      <b>Legend</b>
      <span class="legend-item"><i class="dot" style="background:#2d6f9f"></i>Technician</span>
      <span class="legend-item"><i class="dot" style="background:#6c55a3"></i>Apprentice</span>
      <span class="legend-item"><i class="dot" style="background:#24704f"></i>Electrician</span>
      <span class="legend-item"><span class="tag high">HIGH</span>Priority</span>
      <span class="legend-item"><span class="tag behind">BEHIND</span>Behind schedule</span>
      <span class="legend-item"><span class="tag ot">OT</span>Overtime day</span>
      <span class="legend-item"><span class="status pto">PTO</span></span>
      <span class="legend-item"><span class="status school">SCHOOL</span></span>
    </div>
  </main>
</div>

<div class="modal" id="jobModal"><div class="modal-card"><div class="modal-head"><h3>Add Job</h3><button class="btn small" data-close>Close</button></div><div class="modal-body"><div class="grid2">
<div class="field"><label>Job name</label><input id="jName" placeholder="Example: SAT 80/81"></div>
<div class="field"><label>Job number</label><input id="jNumber" placeholder="43002"></div>
<div class="field"><label>Division</label><select id="jDivision"><option value="electrical">Electrical</option><option value="security">Security</option></select></div>
<div class="field"><label>Day</label><select id="jDay"></select></div>
<div class="field"><label>Priority</label><select id="jPriority"><option value="regular">Regular</option><option value="high">High Priority</option></select></div>
<div class="field"><label>Schedule status</label><select id="jStatus"><option value="on">On Schedule</option><option value="behind">Behind Schedule</option></select></div>
<div class="field"><label>% complete</label><input id="jPercent" type="number" min="0" max="100" value="0"></div>
<div class="field"><label>Estimated completion</label><input id="jFinish" type="date"></div>
<div class="field"><label>Day type</label><select id="jOT"><option value="regular">Regular 8-Hour Day</option><option value="ot">Overtime Day</option></select></div>
<div class="field"><label>Job location</label><input id="jLocation" placeholder="City / jobsite"></div>
<div class="field full"><label>Notes</label><textarea id="jNotes" placeholder="Optional look-ahead notes"></textarea></div>
</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveJob">Add Job</button></div></div></div>

<div class="modal" id="employeeModal"><div class="modal-card"><div class="modal-head"><h3>Add Employee</h3><button class="btn small" data-close>Close</button></div><div class="modal-body"><div class="grid2">
<div class="field full"><label>Name</label><input id="eName"></div>
<div class="field"><label>Division</label><select id="eDivision"><option value="electrical">Electrical</option><option value="security">Security</option></select></div>
<div class="field"><label>Classification</label><select id="eClass"><option>Technician</option><option>Apprentice</option><option>Electrician</option><option>Foreman</option><option>Other</option></select></div>
<div class="field"><label>Status</label><select id="eStatus"><option value="available">Available</option><option value="pto">PTO</option><option value="school">School</option><option value="absent">Absent</option></select></div>
</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveEmployee">Add Employee</button></div></div></div>

<div class="modal" id="assignModal"><div class="modal-card"><div class="modal-head"><h3>Assign Employee</h3><button class="btn small" data-close>Close</button></div><div class="modal-body"><div class="grid2">
<div class="field full"><label>Employee</label><select id="aEmployee"></select></div>
<div class="field"><label>Assignment</label><select id="aTime"><option value="8">Full Day · 8 hrs</option><option value="4am">AM · 4 hrs</option><option value="4pm">PM · 4 hrs</option><option value="custom">Custom hours</option></select></div>
<div class="field"><label>Custom hours</label><input id="aHours" type="number" min="0" max="24" step=".5" value="8"></div>
<div class="field"><label>Crew lead</label><select id="aLead"><option value="no">No</option><option value="yes">Yes</option></select></div>
<div class="field"><label>Pair under lead</label><select id="aUnder"><option value="">None</option></select></div>
</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveAssign">Assign</button></div></div></div>

<script>
const EMPLOYEES=["Aaron Allen","Abraham Gonzalez","Adrian Acosta","Adrian Vasquez","Aidan Rexelle","Alan Lopez Becerra","Alberto Medellin","Alberto Santos","Alex Hecker Salis","Andrew Farnsworth","Andrez Garcia","Angel Avitua","Angel Contreras","Arcade Habonimana","Arturo Santillan","Asa Peck","Benny Hernandez","Bobby Robnett","Brandon Delgado","Branson Belcher","Brennan Rodriguez","Brian Guerra","Brigido Rodriguez","Caleb Stephens","Carl Koenig","Carlos Barron","Carlos Pena","Christopher Boyd","Christopher Carmona","Christopher Martin","Cierra Mioduski","Conor McCary","Cortlan Todd","Daniel Browne","Daniel Simmons","Daniel Ybarra","Darren Rodarte","David Barta","David Jimenez","David Luevano","Demetri Buford","Demetrius Hicks","Douglas Alumbaugh","Eduardo Reyes","Edward Gaydos","Edward Hayes","Esteban Jaramillo","Estevan Ruvalcaba","Ethan Nuncio","Evan Hasberry","Evelyn Fernandez","Francisco Castillo","Francisco De La Fuente","Gary Marburger","Genalyn Rosario","Georganna Flores","Gilbert Green","Heath Nichols","Hector Gutierrez","Ian Cruz Mercado","Issa Moussa","Jace Gola","Jacob Cunningham","Jacob Wright","Jason Aguilar","Jeffry Howard","Jeremiah Ryan","Jeremy Flores","Jerry Hewitt","Jerry Troop","Jesus Aguilar","Joao Deca","Johnaton Torres","Johnny Glover","Johnny Martinez","Johnny Rodriguez","Jonathan Guerra","Jordan Ball","Jorge Rosales","Jose De La Fuente","Joshua Avila","Joshua Hummel","Joshua Noftzger","Joshua Vaughn","Justin Winters","Kaitlyn Beers","Keneau Doerk","Kristof Brown","Leslie Montoya","Lucas Mendiola","Ludrick Valbrun","Luis Gonzalez Munoz","Luis Rodriguez","Magdalena Corona","Maria Lara","Mario Clark","Marlee Rosales","Matthew Gabel","McKenzie Tupper","Michael Zapata","Nathan Ovalle","Nicholas Rangel","Noah Kats","Paul Sierra","Pedro Ojeda","Rashad Brown","Ray Sanchez","Rene Escobedo","Rene Padilla","Richard Heard","Robert Herrera","Robert Livar","Ruben Ponce","Ryan Raquedan","Ryan San Miguel Hernandez","Sarah Livar","Sean Galvan","Sonny Miramontes","Steve Perez","Tristan Ramirez","William Senkowsky","Xzavier Hernandez","Yuri Stuart","Zachary Cundiff","Zachary Giunta"];
const colors={Technician:'#2d6f9f',Apprentice:'#6c55a3',Electrician:'#24704f',Foreman:'#9b6a19',Other:'#74818c'};
const KEY='cdi_manpower_v2';
let start=monday(new Date());let division='all';let assignJob=null;
let state=load()||{employees:EMPLOYEES.map((n,i)=>({id:'e'+i,name:n,division:i%2?'electrical':'security',classification:'Other',status:'available'})),jobs:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function monday(d){d=new Date(d);const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d}
function iso(d){return d.toISOString().slice(0,10)}
function fmt(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function weekDates(){return Array.from({length:5},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d})}
function render(){renderEmployees();renderCalendar();document.getElementById('weekLabel').textContent=`${fmt(start)} – ${fmt(weekDates()[4])}`}
function renderEmployees(){const q=document.getElementById('employeeSearch').value.toLowerCase();const active=document.querySelector('.filter-row .chip.active')?.dataset.filter||'all';const rows=state.employees.filter(e=>(!q||e.name.toLowerCase().includes(q))&&(active==='all'||active==='available'?e.status==='available':e.division===active));document.getElementById('employeeList').innerHTML=rows.map(e=>`<div class="person" draggable="true" data-eid="${e.id}"><i class="dot" style="background:${colors[e.classification]||colors.Other}"></i><div class="person-main"><div class="person-name">${esc(e.name)}</div><div class="person-meta">${esc(e.classification)} · ${esc(e.division)}</div></div>${e.status!=='available'?`<span class="status ${e.status}">${e.status==='school'?'SCHOOL':e.status.toUpperCase()}</span>`:''}</div>`).join('')||'<div class="empty">No employees match this filter.</div>';bindDrag()}
function renderCalendar(){const days=weekDates();document.getElementById('jDay').innerHTML=days.map(d=>`<option value="${iso(d)}">${d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</option>`).join('');document.getElementById('calendar').innerHTML=days.map(d=>dayHtml(d)).join('');bindCalendar()}
function dayHtml(d){const date=iso(d);let jobs=state.jobs.filter(j=>j.date===date&&(division==='all'||j.division===division));let allAssignments=jobs.flatMap(j=>j.assignments||[]);let reg=0,ot=0;allAssignments.forEach(a=>{const j=jobs.find(x=>(x.assignments||[]).includes(a));if(j?.dayType==='ot')ot+=a.hours;else reg+=a.hours});return `<section class="day" data-date="${date}"><div class="day-head"><div class="day-top"><div><div class="day-name">${d.toLocaleDateString(undefined,{weekday:'long'})}</div><div class="date">${fmt(d)}</div></div><div class="weather">Weather<br><span>—</span></div></div><div class="day-summary"><span class="pill">${jobs.length} jobs</span><span class="pill">${allAssignments.length} people</span><span class="pill">${reg} reg hrs</span>${ot?`<span class="pill ot">${ot} OT hrs</span>`:''}</div></div><div class="day-body">${jobs.map(jobHtml).join('')}<button class="add-job" data-add-job="${date}">+ Add job</button></div></section>`}
function jobHtml(j){const assignments=j.assignments||[];const groups={};assignments.forEach(a=>{const e=state.employees.find(x=>x.id===a.employeeId);if(!e)return;(groups[e.classification]??=[]).push({...a,e})});const stats=Object.entries(groups).map(([k,v])=>`${k}: ${v.reduce((s,a)=>s+a.hours,0)}h`).join(' · ');return `<article class="job ${j.priority==='high'?'high':''} ${j.status==='behind'?'behind':''}" data-jid="${j.id}"><div class="job-head"><div class="job-main"><div class="job-title">${esc(j.name)}</div><div class="job-sub">${esc(j.number||'No job #')} · ${esc(j.division)}</div><div class="job-tags">${j.priority==='high'?'<span class="tag high">HIGH PRIORITY</span>':''}${j.status==='behind'?'<span class="tag behind">BEHIND SCHEDULE</span>':''}${j.dayType==='ot'?'<span class="tag ot">OVERTIME</span>':''}</div></div><button class="collapse" data-collapse="${j.id}">⌄</button></div><div class="job-stats"><span class="stat">${assignments.length} assigned</span><span class="stat">${stats||'0 hrs'}</span><span class="stat">${j.percent||0}% complete</span></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,j.percent||0))}%"></i></div><div class="job-body">${Object.entries(groups).map(([k,v])=>`<div class="class-group"><div class="class-head"><span>${esc(k)}</span><span>${v.reduce((s,a)=>s+a.hours,0)} hrs</span></div>${v.map(a=>assignmentHtml(a,j)).join('')}</div>`).join('')||'<div class="empty">No employees assigned yet.</div>'}${j.notes?`<div class="notes">${esc(j.notes)}</div>`:''}<div class="job-actions"><button data-assign="${j.id}">+ Assign</button><button data-duplicate="${j.id}">Duplicate</button><button data-delete="${j.id}">Delete</button></div></div></article>`}
function assignmentHtml(a,j){const lead=(j.assignments||[]).find(x=>x.lead&&x.employeeId===a.employeeId);const under=a.underLead? ' crew-indent':'';return `<div class="assignment${under}"><i class="dot" style="background:${colors[a.e.classification]||colors.Other}"></i><span class="name">${esc(a.e.name)}</span>${lead?'<span class="lead-badge">LEAD</span>':''}<span class="time">${a.hours}h</span></div>`}
function bindDrag(){document.querySelectorAll('.person').forEach(p=>p.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',p.dataset.eid)))}
function bindCalendar(){document.querySelectorAll('.day').forEach(day=>{day.addEventListener('dragover',e=>e.preventDefault());day.addEventListener('drop',e=>{e.preventDefault();const eid=e.dataTransfer.getData('text/plain');const jobs=state.jobs.filter(j=>j.date===day.dataset.date&&(division==='all'||j.division===division));if(jobs.length===1){quickAssign(jobs[0].id,eid)}else if(jobs.length>1){assignJob=jobs[0].id;openAssign(eid)} })});document.querySelectorAll('[data-add-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.addJob));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{assignJob=b.dataset.assign;openAssign()});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>b.closest('.job').classList.toggle('collapsed'));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this job from the schedule?')){state.jobs=state.jobs.filter(j=>j.id!==b.dataset.delete);save();render()}});document.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>{const j=state.jobs.find(x=>x.id===b.dataset.duplicate);const next=new Date(j.date+'T12:00:00');next.setDate(next.getDate()+1);state.jobs.push({...structuredClone(j),id:'j'+Date.now(),date:iso(next)});save();render()})}
function openJob(date=iso(start)){document.getElementById('jDay').value=date;document.getElementById('jobModal').classList.add('open')}
function openAssign(eid=''){const j=state.jobs.find(x=>x.id===assignJob);if(!j)return;const eligible=state.employees.filter(e=>e.division===j.division&&e.status==='available');document.getElementById('aEmployee').innerHTML=eligible.map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${esc(e.name)} · ${esc(e.classification)}</option>`).join('');const leads=(j.assignments||[]).filter(a=>a.lead).map(a=>state.employees.find(e=>e.id===a.employeeId)).filter(Boolean);document.getElementById('aUnder').innerHTML='<option value="">None</option>'+leads.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');document.getElementById('assignModal').classList.add('open')}
function quickAssign(jid,eid){const j=state.jobs.find(x=>x.id===jid);if(!j)return;j.assignments??=[];j.assignments.push({employeeId:eid,hours:8,lead:false,underLead:''});save();render()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
document.getElementById('addJobTop').onclick=()=>openJob();document.getElementById('addEmployee').onclick=()=>document.getElementById('employeeModal').classList.add('open');document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('saveJob').onclick=()=>{const name=document.getElementById('jName').value.trim();if(!name)return alert('Enter a job name.');state.jobs.push({id:'j'+Date.now(),name,number:document.getElementById('jNumber').value.trim(),division:document.getElementById('jDivision').value,date:document.getElementById('jDay').value,priority:document.getElementById('jPriority').value,status:document.getElementById('jStatus').value,percent:Number(document.getElementById('jPercent').value)||0,finish:document.getElementById('jFinish').value,dayType:document.getElementById('jOT').value,location:document.getElementById('jLocation').value.trim(),notes:document.getElementById('jNotes').value.trim(),assignments:[]});save();document.getElementById('jobModal').classList.remove('open');['jName','jNumber','jLocation','jNotes'].forEach(id=>document.getElementById(id).value='');render()};
document.getElementById('saveEmployee').onclick=()=>{const name=document.getElementById('eName').value.trim();if(!name)return;state.employees.push({id:'e'+Date.now(),name,division:document.getElementById('eDivision').value,classification:document.getElementById('eClass').value,status:document.getElementById('eStatus').value});save();document.getElementById('employeeModal').classList.remove('open');document.getElementById('eName').value='';render()};
document.getElementById('saveAssign').onclick=()=>{const j=state.jobs.find(x=>x.id===assignJob);if(!j)return;let hours=8;const t=document.getElementById('aTime').value;if(t==='4am'||t==='4pm')hours=4;else if(t==='custom')hours=Number(document.getElementById('aHours').value)||0;j.assignments??=[];j.assignments.push({employeeId:document.getElementById('aEmployee').value,hours,lead:document.getElementById('aLead').value==='yes',underLead:document.getElementById('aUnder').value});save();document.getElementById('assignModal').classList.remove('open');render()};
document.getElementById('employeeSearch').oninput=renderEmployees;document.querySelectorAll('.filter-row .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.filter-row .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');renderEmployees()});document.querySelectorAll('#divisionSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#divisionSeg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');division=b.dataset.division;renderCalendar()});
document.getElementById('prevWeek').onclick=()=>{start.setDate(start.getDate()-7);render()};document.getElementById('nextWeek').onclick=()=>{start.setDate(start.getDate()+7);render()};
document.getElementById('duplicateWeek').onclick=()=>{const current=state.jobs.filter(j=>weekDates().map(iso).includes(j.date));const copies=current.map(j=>{const d=new Date(j.date+'T12:00:00');d.setDate(d.getDate()+7);return {...structuredClone(j),id:'j'+Date.now()+Math.random(),date:iso(d)}});state.jobs.push(...copies);save();start.setDate(start.getDate()+7);render()};
render();
</script>
</body>
</html>
